{% extends 'base.html' %}
{% block title %}Register - Dealzim{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Create Account</h2>
    <form method="POST" action="/register">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullname" placeholder="Your full name" required>
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="youremail@gmail.com" required>
        </div>
        <div class="form-group">
            <label>WhatsApp Number</label>
            <input type="text" name="whatsapp" placeholder="+234XXXXXXXXXX" required>
        </div>
        <div class="form-group">
            <label>Location (Campus / Town)</label>
            <input type="text" name="location" placeholder="e.g. University of Lagos" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Choose a password" required>
        </div>
        <div class="form-group">
            <label>I want to</label>
            <select name="role">
                <option value="both">Buy and Sell</option>
                <option value="seller">Sell only</option>
                <option value="buyer">Buy only</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
    </form>
    <div class="form-footer">
        Already have an account? <a href="/login">Login here</a>
    </div>
</div>
{% endblock %}
