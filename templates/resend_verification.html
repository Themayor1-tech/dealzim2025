{% extends 'base.html' %}
{% block title %}Resend Verification - Dealzim{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Resend Verification Email</h2>
    <p style="text-align:center; color:#666; margin-bottom:20px; font-size:14px;">
        Enter the email address you registered with and we will
        send you a new verification link.
    </p>
    <form method="POST" action="/resend-verification">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="youremail@gmail.com" required>
        </div>
        <button type="submit" class="btn btn-primary"
                style="width:100%">
            Resend Verification Link
        </button>
    </form>
    <div class="form-footer">
        Already verified? <a href="/login">Login here</a>
    </div>
</div>
{% endblock %}
